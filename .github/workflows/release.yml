# Push a tag, get a release: npm package, standalone binaries, and the winget
# manifests ready to submit. Nobody has to clone anything to install.
#
#   npm version minor && git push --follow-tags

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Every target is cross-built from Linux: postject patches the binaries,
      # it never runs them.
      - run: node scripts/build.js win-x64 win-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64
      - run: node scripts/winget.js
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/applequeue-*
            dist/SHA256SUMS
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: dist/winget/

  # Opens the pull request against microsoft/winget-pkgs that publishes
  # `winget install applequeue`. Needs WINGET_TOKEN: a classic PAT with
  # public_repo scope on an account that has forked winget-pkgs.
  winget:
    needs: binaries
    runs-on: windows-latest
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: DudeThatsErin.AppleQueue
          installers-regex: 'applequeue-win-(x64|arm64)\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
