name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      # Proves the published tarball installs and runs as `applequeue`,
      # which is the only install path users actually take.
      - run: npm pack
      - run: npm install -g ./applequeue-*.tgz
        shell: bash
      - run: applequeue --version
